{% extends "base.html" %}
{% block title %}Log in — AI Companion{% endblock %}
{% block content %}
{% include "_theme_toggle_floating.html" %}
<div class="center-page">
  <div class="glass card auth-card">
    <h1>Log in</h1>
    <p class="subtitle">Welcome back.</p>

    {% if message %}<div class="info-box">{{ message }}</div>{% endif %}
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required autofocus>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="subtitle auth-footer">
      No account? <a href="/signup" class="plain">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
